# psmux config (tmux-compatible). Reload with: prefix + r

# --- General ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g mode-keys vi
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Keybindings ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Splits open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane resizing (navigation is handled by psmux-vim-navigator: Ctrl-h/j/k/l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vi)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Plugins (PPM): prefix + I install, prefix + U update ---
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'
set -g @plugin 'psmux-plugins/psmux-vim-navigator'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep at the bottom
run '~/.psmux/plugins/ppm/ppm.ps1'

# --- Weather widget (Catppuccin status-right + weather pill), must come after the theme loads ---
set -g status-interval 30
set -g status-right-length 120
set -g status-right "#{?client_prefix,#[bg=#fab387,fg=#11111b,bold] PREF #[fg=#fab387,bg=#1e1e2e]▌ ,}#[fg=#313244,bg=#1e1e2e]▐#[bg=#313244,fg=#a6e3a1] #(pwsh -NoProfile -File %USERPROFILE%\.dotfiles\psmux\weather.ps1 Bouskoura,MA) #[fg=#45475a,bg=#313244]▐#[bg=#45475a,fg=#89dceb] %H:%M #[fg=#585b70,bg=#45475a]▐#[bg=#585b70,fg=#f9e2af] %a #[fg=#cba6f7,bg=#585b70]▐#[bg=#cba6f7,fg=#11111b,bold] %d-%b "
